name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - name: Generate Routes
        run: bun x @tanstack/router-cli generate
      - name: Typecheck
        run: bunx tsc --noEmit
      - name: Lint
        run: bun run lint
      - name: Capability audit
        run: bun run scripts/orphan-audit.ts
      - name: Tests
        run: bun run test
      - name: Build
        run: bun run build
      - name: Install Playwright browsers
        run: bunx playwright install --with-deps chromium
      - name: Generate E2E fixture
        run: bun run scripts/generate-e2e-fixture.ts
      - name: E2E tests
        run: bun run test:e2e
