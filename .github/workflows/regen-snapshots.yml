name: Regen Visual Snapshots

# Manual tool: regenerates linux Playwright baselines and opens a PR with the
# updated PNGs. Needed because contributors on Windows/macOS cannot produce
# linux screenshots locally. The PR path keeps this compliant with the
# required-status-check ruleset on main.
on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: regen-snapshots-${{ github.ref }}
  cancel-in-progress: true

jobs:
  regen:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - name: Generate Routes
        run: bun x @tanstack/router-cli generate
      - name: Install Playwright browsers
        run: bunx playwright install --with-deps chromium
      - name: Generate E2E fixture
        run: bun run scripts/generate-e2e-fixture.ts
      - name: Update visual baselines
        run: bunx playwright test --update-snapshots
        env:
          CI: "1"
      - name: Open PR with updated snapshots
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BASE_REF: ${{ github.ref_name }}
        run: |
          if git diff --quiet -- src/tests/e2e/visual.spec.ts-snapshots/ && \
             [ -z "$(git status --porcelain -- src/tests/e2e/visual.spec.ts-snapshots/)" ]; then
            echo "No snapshot changes"
            exit 0
          fi
          BRANCH="chore/regen-snapshots-${GITHUB_RUN_ID}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add src/tests/e2e/visual.spec.ts-snapshots/
          git commit -m "chore(e2e): regenerate linux visual baselines"
          git push origin "$BRANCH"
          gh pr create --base "$BASE_REF" --head "$BRANCH" \
            --title "chore(e2e): regenerate linux visual baselines" \
            --body "Regenerated by the regen-snapshots workflow (run ${GITHUB_RUN_ID}). Merge when CI is green to refresh stale Playwright baselines."
