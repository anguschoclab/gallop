<svg xmlns="http://www.w3.org/2000/svg" width="800" height="200" viewBox="0 0 800 200">
  <defs>
    <linearGradient id="nightSky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#0F172A"/>
      <stop offset="50%" style="stop-color:#1E293B"/>
      <stop offset="100%" style="stop-color:#334155"/>
    </linearGradient>
  </defs>
  <rect width="800" height="200" fill="url(#nightSky)"/>
  <!-- Stars -->
  <circle cx="100" cy="40" r="1.5" fill="white" opacity="0.8">
    <animate attributeName="opacity" values="0.8;0.3;0.8" dur="3s" repeatCount="indefinite"/>
  </circle>
  <circle cx="250" cy="25" r="1" fill="white" opacity="0.9">
    <animate attributeName="opacity" values="0.9;0.4;0.9" dur="4s" repeatCount="indefinite"/>
  </circle>
  <circle cx="400" cy="50" r="1.2" fill="white" opacity="0.7">
    <animate attributeName="opacity" values="0.7;0.2;0.7" dur="2.5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="550" cy="35" r="1" fill="white" opacity="0.85">
    <animate attributeName="opacity" values="0.85;0.35;0.85" dur="3.5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="700" cy="45" r="1.3" fill="white" opacity="0.75">
    <animate attributeName="opacity" values="0.75;0.25;0.75" dur="5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="150" cy="80" r="0.8" fill="white" opacity="0.6"/>
  <circle cx="350" cy="70" r="1" fill="white" opacity="0.7"/>
  <circle cx="600" cy="60" r="0.9" fill="white" opacity="0.8"/>
  <circle cx="750" cy="90" r="0.7" fill="white" opacity="0.5"/>
  <!-- Moon -->
  <circle cx="650" cy="50" r="25" fill="#FEF3C7" opacity="0.9"/>
  <circle cx="645" cy="48" r="20" fill="#FDE68A" opacity="0.3"/>
</svg>
